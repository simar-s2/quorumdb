<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="216" y2="216">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="links" stroke-width="9" stroke-linecap="round">
      <line x1="128" y1="82" x2="70" y2="184"/>
      <line x1="128" y1="82" x2="186" y2="184"/>
      <line x1="70" y1="184" x2="186" y2="184"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <use href="#links" stroke="url(#link)" filter="url(#glow)" opacity="0.6"/>
  <use href="#links" stroke="url(#link)"/>
  <circle cx="128" cy="82" r="31" fill="none" stroke="url(#link)" stroke-width="6" filter="url(#glow)" opacity="0.7"/>
  <circle cx="128" cy="82" r="31" fill="none" stroke="url(#link)" stroke-width="6"/>
  <circle cx="128" cy="82" r="20" fill="#f8fafc"/>
  <circle cx="70" cy="184" r="20" fill="#f8fafc"/>
  <circle cx="186" cy="184" r="20" fill="#f8fafc"/>
</svg>
