# Three-node QuorumDB cluster; clients can use any node: n1 on 6379, n2 on 6380, n3 on 6381.
name: quorumdb

x-node: &node
  build:
    context: .
    target: server
  restart: "no"
  stop_grace_period: 5s
  environment:
    GOGC: ${GOGC:-100}

services:
  n1:
    <<: *node
    hostname: n1
    command: ["-id", "n1", "-redis-addr", ":6379", "-raft-addr", ":7000",
              "-peers", "n1=n1:7000,n2=n2:7000,n3=n3:7000", "-data", "/data",
              "-snapshot-threshold=${SNAPSHOT_THRESHOLD:-10000}", "-fsync=${FSYNC:-true}"]
    ports: ["6379:6379"]
    volumes: ["n1-data:/data"]

  n2:
    <<: *node
    hostname: n2
    command: ["-id", "n2", "-redis-addr", ":6379", "-raft-addr", ":7000",
              "-peers", "n1=n1:7000,n2=n2:7000,n3=n3:7000", "-data", "/data",
              "-snapshot-threshold=${SNAPSHOT_THRESHOLD:-10000}", "-fsync=${FSYNC:-true}"]
    ports: ["6380:6379"]
    volumes: ["n2-data:/data"]

  n3:
    <<: *node
    hostname: n3
    command: ["-id", "n3", "-redis-addr", ":6379", "-raft-addr", ":7000",
              "-peers", "n1=n1:7000,n2=n2:7000,n3=n3:7000", "-data", "/data",
              "-snapshot-threshold=${SNAPSHOT_THRESHOLD:-10000}", "-fsync=${FSYNC:-true}"]
    ports: ["6381:6379"]
    volumes: ["n3-data:/data"]

  # redis-benchmark and the benchmark tool, on the cluster network so Docker's port forwarding is
  # not measured. Used by `make bench`.
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    volumes: ["./results/local:/results"]

volumes:
  n1-data:
  n2-data:
  n3-data:
